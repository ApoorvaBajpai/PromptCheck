name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: promptcheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Ruff Lint Check
        run: |
          ruff check backend/

      - name: Run Mypy Type Check
        run: |
          mypy backend/app

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/promptcheck_test
        run: |
          cd backend && alembic upgrade head

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/promptcheck_test
        run: |
          pytest backend/tests/ -v

  cli-test:
    name: CLI Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CLI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./cli[dev]"

      - name: Run Ruff Lint Check
        run: |
          ruff check cli/

      - name: Run Mypy Type Check
        run: |
          mypy cli/promptcheck_cli

      - name: Run CLI Tests
        run: |
          pytest cli/tests/ -v

  frontend-test:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Type check
        working-directory: frontend
        run: npm run typecheck || npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build
