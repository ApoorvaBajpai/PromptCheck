name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: promptcheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Ruff Lint Check
        run: |
          ruff check backend/

      - name: Run Mypy Type Check
        run: |
          mypy backend/app

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/promptcheck_test
        run: |
          cd backend && alembic upgrade head

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/promptcheck_test
        run: |
          pytest backend/tests/ -v

  cli-test:
    name: CLI Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CLI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./cli[dev]"

      - name: Run Ruff Lint Check
        run: |
          ruff check cli/

      - name: Run Mypy Type Check
        run: |
          mypy cli/promptcheck_cli

      - name: Run CLI Tests
        run: |
          pytest cli/tests/ -v

  frontend-test:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Type check
        working-directory: frontend
        run: npm run typecheck || npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-e2e:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start Docker services
        run: docker compose up -d

      - name: Wait for backend service health
        run: |
          for i in $(seq 1 30); do
            if curl -f -s http://localhost:8000/healthz | grep -q "healthy"; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Waiting for backend ($i/30)..."
            sleep 2
          done
          echo "Backend failed to become healthy within 60s"
          docker compose logs backend
          exit 1

      - name: Wait for frontend service
        run: |
          for i in $(seq 1 30); do
            if curl -f -s http://localhost:3000 > /dev/null; then
              echo "Frontend is accessible!"
              exit 0
            fi
            echo "Waiting for frontend ($i/30)..."
            sleep 2
          done
          echo "Frontend failed to respond within 60s"
          docker compose logs frontend
          exit 1

      - name: Verify Frontend to Backend proxy routing
        run: |
          # Next.js rewrites /api/* to BACKEND_INTERNAL_URL (http://backend:8000/api/*)
          response=$(curl -f -s http://localhost:3000/api/healthz)
          echo "Proxy health check response: $response"
          echo "$response" | grep -q "healthy"

      - name: Smoke test API endpoint
        run: |
          curl -f -s http://localhost:8000/ | grep -q "PromptCheck"
          curl -f -s http://localhost:8000/docs > /dev/null

      - name: Clean shutdown
        if: always()
        run: docker compose down -v

